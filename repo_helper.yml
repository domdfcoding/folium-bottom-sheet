# Configuration for 'repo_helper' (https://github.com/repo-helper/repo_helper)
---
modname: 'folium-bottom-sheet'
copyright_years: '2026'
author: 'Dominic Davis-Foster'
email: 'dominic@davis-foster.co.uk'
username: 'domdfcoding'
version: '0.1.0b1'
license: 'MIT'
short_desc: 'Adds a toggleable panel to the bottom of the screen, such as to display marker information like a popup.'

enable_conda: false
enable_tests: false
enable_docs: false
use_whey: true
on_pypi: false

python_versions:
 - "3.9"
 - "3.10"
 - "3.11"
 - "3.12"
 - "3.13"

additional_ignore:
 - node_modules

manifest_additional:
  - include folium_bottom_sheet/*.js
  - include folium_bottom_sheet/*.js.map

exclude_files:
  - justfile

extra_formate_deps:
 - formate-js>=0.1.0

extra_formate_types:
 - ts
